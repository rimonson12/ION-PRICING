<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Change order pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #edf1f3;
  --surface: #ffffff;
  --ink: #16222c;
  --ink-2: #4c5b67;
  --rule: #ccd6dd;
  --accent: #1b5e9b;
  --accent-ink: #ffffff;
  --accent-wash: #e3eef7;
  --warn: #9a4a08;
  --warn-wash: #fbebdc;
  --good: #1f6b45;
  --good-wash: #e0f1e8;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f171d;
    --surface: #17222b;
    --ink: #e6edf2;
    --ink-2: #9aacb9;
    --rule: #2b3a46;
    --accent: #6aaee6;
    --accent-ink: #0b1620;
    --accent-wash: #1b2e3f;
    --warn: #f0a36b;
    --warn-wash: #33261a;
    --good: #6fcb9a;
    --good-wash: #16291f;
  }
}
:root[data-theme="dark"] {
  --paper: #0f171d;
  --surface: #17222b;
  --ink: #e6edf2;
  --ink-2: #9aacb9;
  --rule: #2b3a46;
  --accent: #6aaee6;
  --accent-ink: #0b1620;
  --accent-wash: #1b2e3f;
  --warn: #f0a36b;
  --warn-wash: #33261a;
  --good: #6fcb9a;
  --good-wash: #16291f;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3 {
  font-family: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  margin: 0;
  letter-spacing: -0.01em;
}
.app { max-width: 1120px; margin: 0 auto; padding: 28px 20px 72px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.top {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 16px 28px; padding-bottom: 14px; border-bottom: 2px solid var(--ink);
}
h1 { font-size: 30px; line-height: 1.1; font-weight: 700; }
.sub { margin: 6px 0 0; color: var(--ink-2); max-width: 58ch; }
.top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 22px; }
.tab {
  appearance: none; background: none; border: 0; border-bottom: 3px solid transparent;
  padding: 6px 0; font: inherit; font-weight: 500; color: var(--ink-2); cursor: pointer;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.quick { display: flex; gap: 16px; }

/* shared controls */
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.link {
  appearance: none; background: none; border: 0; padding: 4px 0; color: var(--accent);
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.btn {
  appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  border-radius: 4px; padding: 8px 14px; cursor: pointer; font-weight: 500;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
input[type="text"], select {
  width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 4px;
  background: var(--surface); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums;
}
input[type="text"]:disabled, select:disabled { background: transparent; color: var(--ink-2); }
input::placeholder { color: var(--ink-2); opacity: 0.75; }
input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }
.check { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > span { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.hint { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
.hint.warn { color: var(--warn); }

/* sections */
.sec { padding: 28px 0; border-bottom: 1px solid var(--rule); }
.sec > h2 { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
.sec > .lede { margin: 0 0 18px; color: var(--ink-2); max-width: 70ch; }
.fields { display: grid; grid-template-columns: minmax(200px, 2fr) minmax(140px, 1fr) minmax(110px, 1fr) minmax(140px, 1fr); gap: 14px 18px; }
.read { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 24px; margin: 22px 0 0; }
.read dt { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.read dd { margin: 2px 0 0; font: 700 21px/1.2 "Bricolage Grotesque", "IBM Plex Sans", sans-serif; }
.read .strong dd { color: var(--accent); }
.sub-h { font-size: 16px; font-weight: 600; margin: 28px 0 8px; }

/* ledger */
.scroll { overflow-x: auto; max-width: 100%; position: relative; }
table.lines { width: 100%; min-width: 700px; border-collapse: collapse; }
table.lines th {
  text-align: left; font-size: 13px; font-weight: 500; color: var(--ink-2);
  padding: 6px 8px; border-bottom: 1px solid var(--ink);
}
table.lines td { padding: 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.lines th.num, table.lines td.num { text-align: right; white-space: nowrap; }
table.lines td.num { padding-top: 16px; }
table.lines td.item { min-width: 280px; }
table.lines th.qty, table.lines td.qty { width: 96px; }
table.lines td.qty .dash { display: inline-block; padding-top: 8px; color: var(--ink-2); }
table.lines th.x, table.lines td.x { width: 40px; }
table.lines td.item .desc { margin-top: 6px; }
table.lines td.netin { min-width: 130px; }
table.lines td.netin input { text-align: right; }
table.lines tr.empty td { color: var(--ink-2); padding: 18px 8px; }
table.lines tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--ink); padding-top: 12px; }
.x-btn {
  appearance: none; background: none; border: 0; cursor: pointer; font-size: 20px; line-height: 1;
  color: var(--ink-2); padding: 7px 8px; border-radius: 4px;
}
.x-btn:hover { color: var(--warn); }
.add { margin-top: 8px; }

/* options */
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.opt { border-top: 4px solid var(--accent); padding-top: 16px; min-width: 0; }
.opt h2 { font-size: 21px; font-weight: 700; }
.opt .lede { margin: 4px 0 18px; color: var(--ink-2); }
.opt-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin-bottom: 14px; }
.opt-inputs .wide { grid-column: 1 / -1; }
.big { font: 700 48px/1 "Bricolage Grotesque", "IBM Plex Sans", sans-serif; letter-spacing: -0.02em; margin: 18px 0 6px; overflow-wrap: anywhere; }
.big-label { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-top: 18px; }
.delta { font-size: 16px; font-weight: 600; min-height: 1.5em; }
.delta.cost { color: var(--warn); }
.delta.neutral { color: var(--accent); }
.rows { margin: 18px 0 0; }
.rows > div { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.rows dt { color: var(--ink-2); }
.rows dd { margin: 0; font-weight: 500; text-align: right; }
.warnbox { display: block; margin-top: 12px; padding: 10px 12px; background: var(--warn-wash); color: var(--warn); border-radius: 4px; font-weight: 500; }
.warnbox:empty { display: none; }
.method { margin: 14px 0 0; font-size: 13px; color: var(--ink-2); max-width: 60ch; }
.opt2-ledger { margin: 4px 0 14px; }
.copy-row { display: flex; align-items: center; gap: 14px; padding-top: 26px; }
.copy-status { color: var(--good); font-weight: 500; }

/* settings */
.status { margin: 0 0 16px; padding: 10px 12px; border-radius: 4px; background: var(--accent-wash); }
.status.err { background: var(--warn-wash); color: var(--warn); }
.status.ok { background: var(--good-wash); color: var(--good); }
.status:empty { display: none; }
table.edit { width: 100%; border-collapse: collapse; min-width: 1000px; }
table.edit.narrow { min-width: 560px; }
table.edit td:first-child input, table.edit td:first-child select { min-width: 230px; }
table.edit select { min-width: 140px; }
table.edit td input { min-width: 90px; }
table.edit th { text-align: left; font-size: 13px; font-weight: 500; color: var(--ink-2); padding: 6px 6px; border-bottom: 1px solid var(--ink); }
table.edit td { padding: 6px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
table.edit td.ro { color: var(--ink-2); white-space: nowrap; }
.save-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding-top: 24px; }

/* pricing guide */
.g-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; padding: 26px 0 16px; border-bottom: 1px solid var(--rule); }
.g-top h2 { font-size: 24px; font-weight: 700; }
.g-top p { margin: 4px 0 0; color: var(--ink-2); max-width: 56ch; }
.g-range { text-align: right; }
.g-lab { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.g-val { font: 700 40px/1.05 "Bricolage Grotesque", "IBM Plex Sans", sans-serif; letter-spacing: -0.02em; color: var(--accent); }
.g-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
.g-search { flex: 1 1 280px; max-width: 420px; display: flex; flex-direction: column; gap: 5px; }
.g-search span { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.g-search input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); color: var(--ink); font: inherit; }
.g-search input::placeholder { color: var(--ink-2); opacity: 0.75; }
.g-jump { display: flex; flex-wrap: wrap; gap: 6px 20px; }
.g-jump a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.g-cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 0 48px; align-items: start; }
.g-col { min-width: 0; }
.gsec { padding: 26px 0 8px; border-top: 1px solid var(--rule); margin-top: 20px; }
.gsec.first { border-top: 0; margin-top: 0; }
.gsec h2 { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
.gsec h3 { font-size: 15px; font-weight: 600; margin: 18px 0 4px; }
.g-lede { margin: 2px 0 12px; color: var(--ink-2); max-width: 64ch; }
.g-callout { margin: 8px 0 12px; padding: 10px 12px; background: var(--accent-wash); border-radius: 4px; }
.g-note { margin: 10px 0 0; font-size: 13.5px; color: var(--ink-2); }
table.g { width: 100%; border-collapse: collapse; }
table.g th { text-align: left; font-size: 13px; font-weight: 500; color: var(--ink-2); padding: 6px 8px; border-bottom: 1px solid var(--ink); }
table.g td { padding: 9px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.g th.num, table.g td.num { text-align: right; white-space: nowrap; }
table.g td.num { font-weight: 600; }
table.g td.item { font-weight: 500; }
table.g td.muted, table.g td.rep { color: var(--ink-2); }
table.g td.rep { opacity: 0.55; }
table.g td.term { white-space: nowrap; }
table.g td.notes { color: var(--ink-2); font-size: 14px; }
table.g tr.grp td { border-top: 1px solid var(--ink-2); }
.tag { display: inline-block; margin: 0 6px 3px 0; padding: 1px 8px; border-radius: 3px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.tag.mid { background: var(--accent-wash); color: var(--accent); }
.tag.cash { background: var(--good-wash); color: var(--good); }
.tag.tx { background: var(--warn-wash); color: var(--warn); }
.g-empty { padding: 40px 0; color: var(--ink-2); }
@media (max-width: 860px) {
  .g-cols { grid-template-columns: minmax(0, 1fr); }
  .g-range { text-align: left; }
  .g-val { font-size: 34px; }
}
@media (max-width: 480px) { table.g td, table.g th { padding-left: 6px; padding-right: 6px; } }

@media (max-width: 860px) {
  .options { grid-template-columns: 1fr; gap: 44px; }
  .fields { grid-template-columns: 1fr 1fr; }
  .fields .fld:first-child { grid-column: 1 / -1; }
  .top-right { align-items: flex-start; }
  .big { font-size: 40px; }
}
@media (max-width: 480px) {
  .app { padding: 20px 14px 64px; }
  h1 { font-size: 26px; }
  .opt-inputs { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Change order pricing</h1>
      <p class="sub">Price a change order, or look up what everything costs on the current pricing sheet.</p>
    </div>
    <div class="top-right">
      <div class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" role="tab" id="tab-calc" type="button">Calculator</button>
        <button class="tab" role="tab" id="tab-guide" type="button">Pricing guide</button>
        <button class="tab" role="tab" id="tab-settings" type="button">Calculator prices</button>
      </div>
      <div class="quick" id="quick">
        <button class="link" type="button" id="btn-example">Load an example</button>
        <button class="link" type="button" id="btn-reset">Start over</button>
      </div>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
(function () {
  'use strict';

  /* ---------- built-in price lists (from the DV calculator workbook) ---------- */
  var CATS = ['Battery', 'Electrical', 'Roof & mounting', 'Other'];
  var KINDS = { fixed: 'Fixed price', perWatt: 'Per watt', perUnit: 'Per unit', quote: 'Quoted amount' };

  var STATE_NAMES = {
    CO: 'Colorado', CT: 'Connecticut', IL: 'Illinois', MA: 'Massachusetts', MD: 'Maryland', NM: 'New Mexico',
    NV: 'Nevada', OH: 'Ohio', OK: 'Oklahoma', OR: 'Oregon', RI: 'Rhode Island', TX: 'Texas', UT: 'Utah', VA: 'Virginia'
  };
  var STATE_CODES = Object.keys(STATE_NAMES).sort(function (a, b) { return STATE_NAMES[a] < STATE_NAMES[b] ? -1 : 1; });
  /* ---------- helpers ---------- */
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function uid() { return 'x' + Math.random().toString(36).slice(2, 9); }
  function num(v) {
    var n = parseFloat(String(v == null ? '' : v).replace(/[$,\s]/g, ''));
    return isFinite(n) ? n : 0;
  }
  var USD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
  function money(n) { return isFinite(n) ? USD.format(n) : '\u2014'; }
  function ppw(n) { return isFinite(n) ? (n < 0 ? '-' : '') + '$' + Math.abs(n).toFixed(3) : '\u2014'; }
  function pct(n) { return (Math.round(n * 100) / 100) + '%'; }

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      });
    }
    for (var i = 2; i < arguments.length; i++) {
      var kids = Array.isArray(arguments[i]) ? arguments[i] : [arguments[i]];
      kids.forEach(function (kid) {
        if (kid == null || kid === false) return;
        el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      });
    }
    return el;
  }

  function textInput(o) {
    var el = h('input', {
      type: 'text', inputmode: o.inputmode || 'decimal', autocomplete: 'off', spellcheck: 'false',
      placeholder: o.placeholder || '', 'aria-label': o.label || null, class: o.cls || null, disabled: !!o.disabled
    });
    el.value = o.value == null ? '' : o.value;
    if (o.onInput) el.addEventListener('input', function () { o.onInput(el.value); });
    return el;
  }

  // options: [{value,label}] or [{group, options:[...]}]
  function selectEl(options, value, onChange, label, disabled) {
    var el = h('select', { 'aria-label': label || null, disabled: !!disabled });
    options.forEach(function (o) {
      if (o.group) {
        var g = h('optgroup', { label: o.group });
        o.options.forEach(function (x) { g.append(h('option', { value: x.value, text: x.label })); });
        el.append(g);
      } else {
        el.append(h('option', { value: o.value, text: o.label }));
      }
    });
    el.value = value;
    if (el.value !== value && el.options.length) el.selectedIndex = 0;
    if (onChange) el.addEventListener('change', function () { onChange(el.value); });
    return el;
  }

  /* ---------- state ---------- */
  var pricing = { financing: [], items: [], overrides: [] };
  var guideData = null;
  var loaded = false;
  var loadError = '';
  var lastR = null;

  var state = freshState();
  function freshState() {
    return {
      tab: 'calc',
      guideQ: '',
      job: { finId: '', st: '', kw: '', gross: '' },
      existing: [],
      change: [],
      opt2: { finId: '', kw: '', net: '', same: true, keepExisting: true, lines: [] }
    };
  }
  function newLine() { return { itemId: '', qty: '1', amount: '', label: '' }; }
  function fin(id) { return pricing.financing.filter(function (f) { return f.id === id; })[0] || null; }
  function item(id) { return pricing.items.filter(function (i) { return i.id === id; })[0] || null; }
  function finByName(n) { return pricing.financing.filter(function (f) { return f.name === n; })[0] || null; }
  function itemByName(n) { return pricing.items.filter(function (i) { return i.name === n; })[0] || null; }

  /* ---------- pricing math ---------- */
  function stateName(code) { return STATE_NAMES[code] || code; }
  function overridesFor(itemId) {
    return (pricing.overrides || []).filter(function (o) { return o.itemId === itemId; });
  }
  // the price that applies to an item in the job's state (falls back to the standard price)
  function eff(it, st) {
    var ov = st ? overridesFor(it.id).filter(function (o) { return o.state === st; })[0] : null;
    if (ov) return { value: ov.value, note: ov.note || it.note, over: true };
    return { value: it.value, note: it.note, over: false };
  }
  function lineNet(line, W, st) {
    var it = item(line.itemId);
    if (!it) return 0;
    var v = eff(it, st).value;
    if (it.kind === 'perWatt') return v * W;
    if (it.kind === 'fixed' || it.kind === 'perUnit') return v * num(line.qty);
    if (it.kind === 'quote') return num(line.amount);
    return 0;
  }
  function sumLines(lines, W, st) {
    return lines.reduce(function (s, l) { return s + lineNet(l, W, st); }, 0);
  }
  function rateText(it, st) {
    var v = eff(it, st).value;
    if (it.kind === 'perWatt') return '$' + v.toFixed(3) + ' per watt';
    if (it.kind === 'perUnit') return money(v) + ' per ' + (it.unit || 'unit');
    return '';
  }

  function compute() {
    var j = state.job, o = state.opt2;
    var f1 = fin(j.finId);
    var kw = num(j.kw), gross = num(j.gross), W = kw * 1000;
    var factor = f1 ? 1 - f1.fee / 100 : NaN;
    var st = j.st;
    var R = { f1: f1, st: st, kw: kw, gross: gross, W: W, factor: factor };
    R.ok = !!f1 && W > 0 && gross > 0 && factor > 0;
    R.ctxJob = { W: W, factor: factor, st: st };
    R.existingNet = sumLines(state.existing, W, st);
    R.changeNet = sumLines(state.change, W, st);

    if (R.ok) {
      R.grossPPW = gross / W;
      R.netCost = gross * factor - R.existingNet;
      R.netPPW = R.netCost / W;
      R.o1NetCost = R.netCost - R.changeNet;
      R.o1PPW = R.o1NetCost / W;
      R.o1GiveUp = R.netPPW - R.o1PPW;
    }

    var f2c = fin(o.finId);
    var f2 = (f2c && f2c.loan !== false) ? f2c : f1;
    R.showO2 = !(f1 && f1.loan === false);
    var kw2 = o.kw.trim() !== '' ? num(o.kw) : kw;
    var W2 = kw2 * 1000;
    var factor2 = f2 ? 1 - f2.fee / 100 : NaN;
    var lines2 = o.same ? state.change : o.lines;
    R.f2 = f2; R.kw2 = kw2; R.W2 = W2; R.factor2 = factor2;
    R.ctx2 = { W: W2, factor: factor2, st: st };
    R.o2Changes = sumLines(lines2, W2, st);
    R.o2Existing = o.keepExisting ? sumLines(state.existing, W2, st) : 0;
    R.o2Adders = R.o2Changes + R.o2Existing;
    R.ok2 = false;
    if (R.ok) {
      R.target = o.net.trim() !== '' ? num(o.net) : R.netPPW;
      R.ok2 = W2 > 0 && factor2 > 0;
      if (R.ok2) {
        R.o2Gross = (R.target * W2 + R.o2Adders) / factor2;

    put('grossPPW', ok ? ppw(R.grossPPW) : dash);
    put('fee', R.f1 ? pct(R.f1.fee) : dash);
    put('netBefore', ok ? money(R.gross * R.factor) : dash);
    put('netCost', ok ? money(R.netCost) : dash);
    put('netPPW', ok ? ppw(R.netPPW) : dash);

    if (L.existing) L.existing.refresh(R.ctxJob);
    if (L.change) L.change.refresh(R.ctxJob);
    if (L.opt2) L.opt2.refresh(R.ctx2);

    if (outs.kw2Ph) outs.kw2Ph.placeholder = R.kw > 0 ? 'Same (' + R.kw + ')' : 'Same as today';
    if (outs.net2Ph) outs.net2Ph.placeholder = ok ? 'Same (' + R.netPPW.toFixed(3) + ')' : 'Same as today';

    /* option 1 */
    if (ok) {
      put('o1PPW', ppw(R.o1PPW));
      put('o1GiveUp', R.changeNet === 0 ? 'No adders added yet' : 'The rep gives up ' + ppw(R.o1GiveUp) + ' per watt (' + money(R.changeNet) + ')');
      put('o1Today', ppw(R.netPPW));
      put('o1CostToday', money(R.netCost));
      put('o1Adders', money(R.changeNet));
      put('o1CostAfter', money(R.o1NetCost));
      put('o1Price', money(R.gross) + ' (unchanged)');
      put('o1Warn', R.o1PPW < 0 ? 'The adders are larger than the net cost left on this job, so net PPW goes negative.' : '');
    } else {
      ['o1PPW', 'o1Today', 'o1CostToday', 'o1Adders', 'o1CostAfter', 'o1Price'].forEach(function (k) { put(k, dash); });
      put('o1GiveUp', 'Enter financing, system size, and total cost above.');
      put('o1Warn', '');
    }

    /* option 2 */
    if (ok && R.ok2) {
      put('o2Price', money(R.o2Gross));
      var d = R.o2Delta;
      put('o2Delta', Math.abs(d) < 0.005 ? 'Same as today\u2019s price' : (d > 0 ? 'Up ' : 'Down ') + money(Math.abs(d)) + ' from today\u2019s price');
      put('o2GrossPPW', ppw(R.o2GrossPPW));
      put('o2Target', ppw(R.target));
      put('o2Fee', pct(R.f2.fee));
      put('o2Adders', money(R.o2Adders));

      ['o2Price', 'o2GrossPPW', 'o2Target', 'o2Fee', 'o2Adders', 'o2Today'].forEach(function (k) { put(k, dash); });
      put('o2Delta', ok ? '' : 'Enter financing, system size, and total cost above.');
      put('o2Warn', ok && !R.ok2 ? 'Check the financing and system size for this option. A 100% dealer fee or a size of 0 can\u2019t be priced.' : '');
    }

  function copySummary() {
    var R = lastR || compute();
    if (!R.ok) { put('copied', 'Fill in the job first.'); setTimeout(function () { put('copied', ''); }, 2500); return; }
    var lines = [];
    lines.push('Change order pricing');
    lines.push('Job: ' + R.f1.name + ', ' + (R.st ? stateName(R.st) + ', ' : '') + R.kw + ' kW, total ' + money(R.gross) + ' (' + ppw(R.grossPPW) + '/W gross)');
    lines.push('Net PPW today: ' + ppw(R.netPPW) + ' after ' + money(R.existingNet) + ' of adders');
    lines.push('');
    lines.push('Being added:');
    var any = false;
    state.change.forEach(function (l) {
      var it = item(l.itemId); if (!it) return;
      any = true;
      var nm = it.kind === 'quote' && l.label ? it.name + ' (' + l.label + ')' : it.name;
      var q = (it.kind === 'fixed' || it.kind === 'perUnit') && num(l.qty) !== 1 ? ' x ' + num(l.qty) + (it.kind === 'perUnit' ? ' ' + (it.unit || '') : '') : '';
      lines.push('- ' + nm + q + ': ' + money(lineNet(l, R.W)) + ' net');
    });
    if (!any) lines.push('- nothing yet');
    lines.push('Total: ' + money(R.changeNet) + ' net');
    lines.push('');
    lines.push('Option 1, rep covers with PPW: net PPW goes from ' + ppw(R.netPPW) + ' to ' + ppw(R.o1PPW) + ' (' + ppw(R.o1GiveUp) + '/W given up). Customer price stays ' + money(R.gross) + '.');
    if (R.showO2 && R.ok2) {
      lines.push('Option 2, add to the loan: ' + R.f2.name + ', ' + R.kw2 + ' kW, holding ' + ppw(R.target) + ' net PPW. New total ' + money(R.o2Gross) + ' (' + ppw(R.o2GrossPPW) + '/W gross), ' + (R.o2Delta >= 0 ? 'up ' : 'down ') + money(Math.abs(R.o2Delta)) + ' from today.');
    }
    var text = lines.join('\n');
    function done(okc) {
      put('copied', okc ? 'Copied.' : 'Couldn\u2019t copy. Select and copy the text manually.');
      setTimeout(function () { put('copied', ''); }, 2500);
    }
    function fallback() {
      var ta = h('textarea', { 'aria-hidden': 'true', style: 'position:fixed;opacity:0;top:0;left:0' });
      ta.value = text; document.body.append(ta); ta.select();
      var okc = false;
      try { okc = document.execCommand('copy'); } catch (e) { okc = false; }
      ta.remove(); done(okc);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else { fallback(); }
  }

  /* ---------- price lists view ---------- */

  function sanitizeCalc(data) {
    if (!data || !Array.isArray(data.financing) || !Array.isArray(data.items)) return null;
    var financing = [], items = [];
    data.financing.forEach(function (f) {
      if (!f || typeof f.name !== 'string' || !f.name.trim()) return;
      var fee = Number(f.fee); if (!isFinite(fee)) fee = 0;
      financing.push({ id: String(f.id || uid()), name: f.name, fee: Math.min(100, Math.max(0, fee)), loan: typeof f.loan === 'boolean' ? f.loan : !/^(tpo|owner financed)$/i.test(f.name.trim()) });
    });
    data.items.forEach(function (i) {
      if (!i || typeof i.name !== 'string' || !i.name.trim()) return;
      var v = Number(i.value); if (!isFinite(v)) v = 0;
      items.push({
        id: String(i.id || uid()), name: i.name,
        cat: CATS.indexOf(i.cat) >= 0 ? i.cat : 'Other',
        kind: KINDS[i.kind] ? i.kind : 'fixed',
        value: v, unit: typeof i.unit === 'string' ? i.unit : '', note: typeof i.note === 'string' ? i.note : ''
      });
    });
    if (!financing.length) return null;
    var overrides = [];
    (Array.isArray(data.overrides) ? data.overrides : []).forEach(function (o) {
      if (!o || !STATE_NAMES[o.state]) return;
      var iid = String(o.itemId);
      if (!items.some(function (i) { return i.id === iid; })) return;
      var v = Number(o.value); if (!isFinite(v)) v = 0;
      overrides.push({ id: String(o.id || uid()), itemId: iid, state: o.state, value: v, note: typeof o.note === 'string' ? o.note : '' });
    });
    return { financing: financing, items: items, overrides: overrides };
  }
  function sanitizeFile(data) {
    var p = data && data.calculator ? sanitizeCalc(data.calculator) : null;
    if (!p) return null;
    return { pricing: p, guide: data.guide && typeof data.guide === 'object' ? data.guide : null };
  }
  function downloadPricingFile(calc) {
    var file = { calculator: calc, guide: guideData || {} };
    var blob = new Blob([JSON.stringify(file, null, 2) + '\n'], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: 'pricing.json' });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

    function markDirty() {
      var d = isDirty();

    var finBody = h('tbody');

    function buildFin() {

    function validate() {

      pricing = sanitizeCalc(payload);
      draft = clone(pricing);

    discardBtn.addEventListener('click', function () {

      h('div', { class: 'scroll' }, h('table', { class: 'edit narrow' },
        h('thead', null, h('tr', null, h('th', { text: 'Product' }), h('th', { text: 'Dealer fee (%)' }), h('th', { text: 'Net factor' }), h('th', { text: 'Can add to the loan' }), h('th'))),
        finBody)),

    var itemSec = h('section', { class: 'sec' },

        h('thead', null, h('tr', null, h('th', { text: 'Item' }), h('th', { text: 'Group' }), h('th', { text: 'Priced' }), h('th', { text: 'Price or rate ($)' }), h('th', { text: 'Unit' }), h('th', { text: 'Note' }), h('th'))),
        itemBody)),
      editable ? h('button', { class: 'link add', type: 'button', text: 'Add an item', onclick: function () { draft.items.push({ id: uid(), name: '', cat: 'Other', kind: 'fixed', value: 0, unit: '', note: '' }); buildItems(); buildOver(); markDirty(); } }) : null);

    var overSec = h('section', { class: 'sec' },
      h('h2', { text: 'State prices' }),
      h('p', { class: 'lede', text: 'When a job is in one of these states, the adder uses this price instead of the standard one above, so nobody has to pick a state-specific item. States not listed here use the standard price.' }),
      h('div', { class: 'scroll' }, h('table', { class: 'edit narrow' },
        h('thead', null, h('tr', null, h('th', { text: 'Item' }), h('th', { text: 'State' }), h('th', { text: 'Price or rate ($)' }), h('th', { text: 'Note' }), h('th'))),
        overBody)),
      editable ? h('button', { class: 'link add', type: 'button', text: 'Add a state price', onclick: function () { draft.overrides.push({ id: uid(), itemId: '', state: '', value: 0, note: '' }); buildOver(); markDirty(); } }) : null,
      editable ? h('div', { class: 'save-row' }, saveBtn, discardBtn) : null);

    wrap.append(h('div', { style: 'padding-top:22px' }, statusEl), finSec, itemSec, overSec);
    markDirty();
    return wrap;
  }

  /* ---------- pricing guide (reference sheet) ---------- */
  function gTable(cols, rows, opts) {
    opts = opts || {};
    var thead = h('thead', null, h('tr', null, cols.map(function (c) {
      return h('th', { scope: 'col', class: c.kind === 'num' ? 'num' : null, text: c.label });
    })));
    var tbody = h('tbody');
    rows.forEach(function (r, ri) {

      var q = [];
      r.forEach(function (cell, ci) {

        var cls = kind === 'item' ? 'item' : kind === 'num' ? 'num' : kind === 'notes' ? 'notes' : kind === 'muted' ? 'muted' : kind === 'term' ? 'muted term' : null;
        if (opts.repeatCol === ci && opts.repeats && opts.repeats[ri]) cls = 'rep';

  }

  function buildGuide() {
    if (!guideData) return h('p', { class: 'g-empty', text: 'pricing.json has no "guide" section yet, so there is nothing to show here.' });
    var wrap = h('div', { class: 'guide' });
    var gsecs = [];
    function gsection(id, title, parts, nav) {
      var sec = h('section', { class: 'gsec', id: 'g-' + id }, h('h2', { text: title }), parts);
      sec.dataset.title = (title + ' ' + nav).toLowerCase();

    var G = guideData;

      gTable([{ label: 'Lender', kind: 'item' }, { label: 'Term', kind: 'term' }, { label: 'Rate', kind: 'num' }, { label: 'Pricing', kind: 'muted' }],
        loanRows, { repeatCol: 0, repeats: repeats, groupStarts: groupStarts })

    colL.append(gsection('small', 'Small system adder', [
      h('p', { class: 'g-lede', text: 'A flat adder by panel count. The same adder is shown per watt below.' }),
      gTable([{ label: 'Panels', kind: 'item' }, { label: 'Adder', kind: 'num' }], list('smallFlat').map(function (r) { return [r.panels || '', r.adder || '']; })),
      h('h3', { text: 'Per watt' }),
      gTable([{ label: 'Panels', kind: 'item' }, { label: 'System size', kind: 'term' }, { label: 'Per watt', kind: 'num' }], list('smallPerWatt').map(function (r) { return [r.panels || '', r.size || '', r.perWatt || '']; }))
    ], 'Small system'));

    colL.append(gsection('travel', 'Travel adders', [
      h('p', { class: 'g-lede', text: 'Priced per watt, by distance. Financed jobs cost more than cash.' }),
      gTable([{ label: 'Distance', kind: 'item' }, { label: 'Cash (per watt)', kind: 'num' }, { label: 'Financed (per watt)', kind: 'num' }], list('travel').map(function (r) { return [r.distance || '', r.cash || '', r.financed || '']; }))
    ], 'Travel'));

    var adderCols = [{ label: 'Item', kind: 'item' }, { label: 'Price', kind: 'num' }, { label: 'Notes', kind: 'notes' }];
    colR.append(gsection('battery', 'Battery adders', [
      gTable(adderCols, rows3('battery')),
      noteP('batteryNote')
    ], 'Batteries'));
    colR.append(gsection('electrical', 'Electrical adders', [
      gTable(adderCols, rows3('electrical')),
      noteP('electricalNote')
    ], 'Electrical'));
    colR.append(gsection('roof', 'Specialty roof and mounting adders', [gTable(adderCols, rows3('roof'))], 'Roof and mounting'));
    colR.append(gsection('other', 'Other adders', [gTable(adderCols, rows3('other'))], 'Other adders'));
    colR.append(gsection('inverters', 'Customer-requested specialty inverters', [
      noteP('invertersNote', 'g-callout'),

    var qEl = h('input', { type: 'search', placeholder: 'Powerwall, travel, GoodLeap, thermostat', autocomplete: 'off', spellcheck: 'false' });

    var jump = h('nav', { class: 'g-jump', 'aria-label': 'Jump to a section' });

    function applyFilter() {
      var q = qEl.value.trim().toLowerCase();

        var rows = sx.el.querySelectorAll('tbody tr');

        h('div', null, h('h2', { text: 'Pricing guide' }), h('p', { text: 'Available loans, adders, and the net PPW range, all in one place.' })),

  /* ---------- shell ---------- */

    render();
  }).catch(function (e) {
    loadError = 'Couldn\u2019t load the prices (' + ((e && e.message) || 'unknown error') + '). If you opened this file straight from your computer, open the website link instead.';
    render();
  });
})();
